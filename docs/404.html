.video-kind{position:absolute;top:16px;left:16px;padding:5px 11px;border-radius:5px;background:#081a24b5;color:#e7eef0;font-size:.7rem;font-weight:650;letter-spacing:.15em}
.video-body{padding:26px 28px 30px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
