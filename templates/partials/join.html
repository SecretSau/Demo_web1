{% set join_glyphs = {'Calendar': 'i-calendar', 'YouTube': 'i-play', 'Volunteer': 'i-hands'} %}

<section class="section section--tight" id="join">
  <div class="wrap">

    <div class="section-head reveal">
      <p class="eyebrow">Join us</p>
      <h2>There is a place for you in this.</h2>
    </div>

    <div class="join-grid">
      {% for card in join %}
      <article class="glass join-card pane-{{ card.pane }} reveal" data-delay="{{ loop.index0 * 80 }}">
        <div class="glass-in" style="display:flex;flex-direction:column;gap:.7rem;height:100%">
          <svg width="26" height="26" aria-hidden="true" style="color:var(--pane)">
            <use href="#{{ join_glyphs[card.kind] }}"/>
          </svg>
          <span class="join-kind">{{ card.kind }}</span>
          <h3>{{ card.title }}</h3>
          <p>{{ card.body }}</p>
          <a class="join-link" href="{{ card.href }}">
            {{ card.cta }}
            <svg class="arrow" width="14" height="14" aria-hidden="true"><use href="#i-arrow"/></svg>
          </a>
        </div>
      </article>
      {% endfor %}
    </div>

  </div>
</section>
