<section class="section" id="mission">
  <div class="wrap">
    <div class="duo">

      <article class="glass creed pane-gold reveal">
        <div class="glass-in" style="display:flex;flex-direction:column;gap:1.15rem">
          <svg class="creed-glyph" width="30" height="30" aria-hidden="true"><use href="#i-cross"/></svg>
          <p class="eyebrow">{{ mission.eyebrow }}</p>
          <h3>{{ mission.title }}</h3>
          <p class="body-text">{{ mission.body }}</p>
        </div>
      </article>

      <article class="glass creed pane-azure reveal" data-delay="90">
        <div class="glass-in" style="display:flex;flex-direction:column;gap:1.15rem">
          <svg class="creed-glyph" width="30" height="30" aria-hidden="true"><use href="#i-spark"/></svg>
          <p class="eyebrow" style="color:var(--azure)">{{ vision.eyebrow }}</p>
          <h3>{{ vision.title }}</h3>
          <p class="body-text">{{ vision.body }}</p>
        </div>
      </article>

    </div>
  </div>
</section>
